# cargo-nextest for the Loft workspace (Keel decision #109). Three rules:
#   1. Real-GPU tests take turns (group `gpu`): each opens its own device, and a pixel check is only meaningful when
#      nothing else renders beside it.
#   2. A hang is reported, never hidden: SLOW every 30 s, killed as a TIMEOUT failure after 5 minutes.
#   3. No retry turns a failure into a pass: one retry only labels it FAIL or FLAKY, and FLAKY fails too.
# Doctests: nextest cannot run them; `tools/dev.sh test CRATE --doc` and check.sh full run `cargo test --doc`.

[test-groups]
gpu = { max-threads = 1 }

[profile.default]
# The machine-wide cap (~/.cargo/config.toml RUST_TEST_THREADS = 4), which nextest does not read.
test-threads = 4
fail-fast = false
retries = { backoff = "fixed", count = 1, delay = "0s" }
flaky-result = "fail"
slow-timeout = { period = "30s", terminate-after = 10 }
status-level = "slow"
final-status-level = "slow"
junit = { path = "junit.xml" }

# Crates that open a real device. Whole packages: a module filter would silently miss the next GPU test added there.
[[profile.default.overrides]]
filter = 'package(loft-loader) | package(loft-gpu) | package(loft-draw)'
test-group = "gpu"
priority = 20
