[package]
name = "loft-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Loft's host (plan 2026-11-19 §1.2, §4, §5): loads a bundle on a caller's wgpu device and draws its frames. The only wgpu crate; never links the compiler."

[dependencies]
loft-ir = { path = "../loft-ir" }
# wgpu's own naga: `validate` parses and checks every module before any GPU object exists (Keel step 6, hot reload).
naga = { workspace = true, features = ["wgsl-in"] }

# Per-target backends matching Keel's (plan §5.1 step 2); dx12 behind a feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["std", "webgpu", "wgsl"] }

[features]
dx12 = ["wgpu/dx12"]

[dev-dependencies]
pollster = "0.4"

# `unsafe` is allowed only in cache.rs (wgpu's pipeline cache takes driver bytes on trust), with a SAFETY: comment.
[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
