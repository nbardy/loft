[package]
name = "loft-loader"
version = "0.1.0"
edition = "2021"
description = "Loads a Loft artefact folder (docs/artefact_format.md) onto a wgpu device and draws its frames."
publish = false

# wgpu 30: the version the game client pins, so the loader can be handed the game's own Device.
[dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# pollster: blocking on error scopes at load (and the binary's device). png and sha2: the binary only.
pollster = "0.4"
png = "0.18"
sha2.workspace = true

[[bin]]
name = "loft-view"
path = "src/bin/loft-view/main.rs"
