# The one Loft Cargo workspace (plan 2026-11-19 §6): one Cargo.lock, one rust/target per worktree. Build through
# tools/dev.sh or tools/check.sh, never bare cargo: they pin the toolchain, admit the target dir and take the compile
# lock shared with Keel (tools/lib/build_gate.sh).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# Exact and equal to Keel's lock: a bump happens in both repos in one change (plan §5.2; tools/check_pins.sh, lane 4.1).
[workspace.dependencies]
wgpu = { version = "=30.0.1", default-features = false }
# naga is wgpu's own and moves with it: loft-core validates generated WGSL with it at compile, with no GPU (lane 2.2).
naga = { version = "=30.0.1", default-features = false }
# Shared by the compiler crates (wave 1): one version each across loft-ir, loft-node and loft-core.
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

# Members opt in with `[lints] workspace = true`. loft-gpu and loft-node override unsafe_code to allow, and each
# `unsafe` block carries a SAFETY: comment naming its contract. loft-ir adds clippy::float_arithmetic = "deny".
# loft-loader moved over unchanged and has not opted in; it becomes loft-gpu in lane 3.2.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Keel's speed-swarm S8 rule: no `_ =>` on an enum Loft owns, so one handler per variant is the compiler's check.
wildcard_enum_match_arm = "deny"

# Profiles copied from Keel (keel/Cargo.toml, measured there 2026-10-30..11-01).
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

# Test executables without debuginfo: 2026-10-30 Keel kept 2.35 GB of unpacked .rcgu.o beside them. Panics keep file:line.
[profile.test]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

# `tools/dev.sh build CRATE --fast`: release code without thin LTO. Keel 2026-11-01: a one-line edit cost 9-10 CPU-s in
# lab against 64-71 CPU-s in release. Use release only for shipped artifacts and performance numbers.
[profile.lab]
inherits = "release"
lto = false
codegen-units = 16
