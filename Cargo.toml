[workspace]
resolver = "3"
members = ["crates/loft-abi", "crates/loft-ir", "crates/loft-format", "crates/loft-parse", "crates/loft-plan", "crates/loft-passes", "crates/loft-runner", "crates/loft-std", "crates/loft-wgpu", "crates/loft-native", "crates/loft-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# GPU dependency versions shared with Keel.
[workspace.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl", "naga-ir"] }
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
pollster = "0.4"
png = "0.18"
serde_json = "1.0.149"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# One handler per variant is the compiler's check (Keel S8).
wildcard_enum_match_arm = "deny"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.lab]
inherits = "release"
lto = false
codegen-units = 16
