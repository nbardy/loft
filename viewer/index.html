<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loft</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="error" hidden></div>
<aside id="panel">
  <div id="readout"></div>
  <div class="row" id="cameras"></div>
  <label class="row"><input type="checkbox" id="construction"> construction</label>
  <div id="params"></div>
  <button id="reset" type="button">reset sliders</button>
</aside>
<footer id="timebar">
  <button id="play" type="button">pause</button>
  <input id="time" type="range" min="0" max="20" step="0.01" value="0">
  <span id="timeText">0.00 s</span>
  <label>speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
