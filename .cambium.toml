version = 1

[settings]
require_cow = true
workspace_root = "~/git/_wt"
merge_target = "origin/main"
prune_merged_on_add = true

# Generated renders and reports: rebuilt per workspace, never cloned (1.7 GB in the primary checkout on 2026-11-19).
[[path]]
path = "out"
policy = "skip"

# New worktrees CoW-clone third-party Cargo artifacts into their own target.
# Run tools/dev.sh seed from the primary checkout to publish or refresh the
# seed for the pinned compiler after dependency, profile, or toolchain changes.
[[path]]
path = "target"
policy = "seed"
seed = "cargo-deps"
