version = 1

[settings]
require_cow = true

# Cargo outputs hold source-path-sensitive state: a target cloned into another checkout reports that tree's crates
# Fresh (Keel 2026-10-30). Each worktree builds its own rust/target; sccache shares compatible units across them.
[[path]]
path = "rust/target"
policy = "skip"

# Generated renders and reports: rebuilt per lane, never cloned (1.7 GB in the primary checkout on 2026-11-19).
[[path]]
path = "out"
policy = "skip"

# The meta workspace's build folder (crates/ at the root), same reason as rust/target.
[[path]]
path = "target"
policy = "skip"
