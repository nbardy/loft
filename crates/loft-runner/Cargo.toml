[package]
name = "loft-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Layer 0: runs a loft-ir Program on a wgpu device (buffers, pipelines, RenderBundle, indirect draws, timing)."

[dependencies]
loft-ir = { path = "../loft-ir" }
blake3 = "1"
wgpu = { workspace = true, features = ["webgpu"] }
naga.workspace = true
wgpu-naga-bridge = "=30.0.1"

[features]
web-sys = ["wgpu/webgpu", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["GpuDevice"] }

[dev-dependencies]
loft-abi = { path = "../loft-abi" }
pollster.workspace = true

[lints]
workspace = true
