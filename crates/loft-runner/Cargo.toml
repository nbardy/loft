[package]
name = "loft-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Layer 0: runs a loft-ir Program on a wgpu device (buffers, pipelines, RenderBundle, indirect draws, timing)."

[dependencies]
loft-abi = { path = "../loft-abi" }
loft-ir = { path = "../loft-ir" }
loft-std = { path = "../loft-std" }
loft-format = { path = "../loft-format" }
blake3 = "1"
wgpu = { workspace = true, features = ["webgpu"] }
naga.workspace = true

[features]
web-sys = ["loft-std/web-sys"]

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
