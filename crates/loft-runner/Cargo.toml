[package]
name = "loft-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Layer 0: runs a loft-ir Program on a wgpu device (buffers, pipelines, RenderBundle, indirect draws, timing)."

[dependencies]
loft-abi = { path = "../loft-abi" }
loft-ir = { path = "../loft-ir" }
loft-wgpu = { path = "../loft-wgpu" }
loft-std = { path = "../loft-std" }
loft-format = { path = "../loft-format" }
blake3 = "1"
wgpu.workspace = true
naga.workspace = true

[features]
cpu-twin = ["loft-std/cpu-twin"]

[dev-dependencies]
pollster.workspace = true

[[example]]
name = "loftb"
path = "tests/probes/loftb.rs"

[[example]]
name = "phase5_host"
path = "tests/probes/phase5_host.rs"

[lints]
workspace = true
