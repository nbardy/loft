[package]
name = "loft-passes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Layer 2: parse, check, stage 0 (comptime rows), derived bounds and Lipschitz, WGSL/naga emit, schedule lowering."

[dependencies]
loft-check = { path = "../loft-check" }
loft-eval = { path = "../loft-eval" }
loft-emit = { path = "../loft-emit" }
loft-gltf = { path = "../loft-gltf" }
loft-abi = { path = "../loft-abi" }
serde-lexpr = "0.1"
loft-parse = { path = "../loft-parse" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tempfile = "3"
loft-ir = { path = "../loft-ir" }
naga = { workspace = true, features = ["serialize", "deserialize", "wgsl-out"] }

[features]
gltf = []

[lints]
workspace = true
